services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sysadmin-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST_PROC=/host/proc
      - DATABASE_URL=sqlite:////app/data/sysadmin_ai.db
    env_file:
      - .env
    volumes:
      # Mount Docker socket and read-only host filesystems so the container monitors the host.
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /:/host/root:ro
      - sysadmin_data:/app/data
    networks:
      - sysadmin-net

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: sysadmin-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - sysadmin-net

volumes:
  sysadmin_data:

networks:
  sysadmin-net:
    driver: bridge
